name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo no mesmo branch cancela a execução anterior (economiza minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false  # se um sistema falhar, o outro termina mesmo assim
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Instalar Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config  # o vcpkg precisa do pkg-config (mesmo erro do Passo 1)

      - name: Definir caminhos do vcpkg
        run: |
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ runner.temp }}/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/vcpkg-cache"

      # Bibliotecas já compiladas (SQLite, Catch2...) de execuções anteriores
      - name: Restaurar cache do vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      # Mesmo commit do builtin-baseline: as mesmas versões de biblioteca da máquina local
      - name: Instalar vcpkg
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar
        run: cmake --preset debug -DJARVIS_WARNINGS_AS_ERRORS=ON

      - name: Compilar
        run: cmake --build --preset debug

      - name: Testar
        run: ctest --preset debug

  format:
    name: Formatação (clang-format)
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Versão fixa: versões diferentes do clang-format formatam diferente
      - name: Instalar clang-format
        run: pipx install clang-format==23.1.5

      - name: Verificar formatação
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror
